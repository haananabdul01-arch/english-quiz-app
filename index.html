// ── Gemini AI ─────────────────────────────────────────────────────────────────
async function callGemini(parts,maxTokens=3000){
  const res=await fetch(GEMINI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}],generationConfig:{maxOutputTokens:maxTokens,temperature:0.7}})});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||`HTTP ${res.status}`);}
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text||"";
}
async function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
async function extractPDFPages(file,pageSpec){
  const b64=await fileToBase64(file);
  return callGemini([{inline_data:{mime_type:"application/pdf",data:b64}},{text:pageSpec?`Extract text ONLY from pages ${pageSpec} of this PDF. Return plain text only.`:`Extract ALL readable text. Return plain text only.`}],4000);
}
async function extractImageText(file){
  const b64=await fileToBase64(file);
  return callGemini([{inline_data:{mime_type:file.type||"image/jpeg",data:b64}},{text:"Extract ALL readable text from this image. Return plain text only."}],3000);
}
async function extractKeywords(text,count=15){
  const raw=await callGemini([{text:`From this English text, extract the ${count} most important vocabulary words for an English learner.\nText: ${text}\nRespond ONLY with a JSON array, no markdown, no backticks:\n[{"word":"...","definition":"...","partOfSpeech":"..."}]`}]);
  const m=raw.match(/\[[\s\S]*\]/);if(!m)throw new Error("No JSON");return JSON.parse(m[0]);
}
async function generateQuizFromText(text,quizType,count){
  const typeMap={vocabulary:"Generate ONLY vocabulary MCQs testing word meaning.",prepositions:"Generate ONLY preposition MCQs — sentences with a blank for a preposition.",fill_blank:"Generate ONLY fill-in-the-blank MCQs.",mix:"Generate a balanced mix of vocabulary, preposition, and fill-in-the-blank."};
  const raw=await callGemini([{text:`You are an English teacher. Generate exactly ${count} MCQs.\nType: ${typeMap[quizType]||typeMap.mix}\nText: ${text.slice(0,6000)}\nRespond ONLY with a valid JSON array, no markdown, no backticks:\n[{"question":"...","options":["A) ...","B) ...","C) ...","D) ..."],"answer":"A","type":"vocabulary"}]`}],4000);
  const m=raw.match(/\[[\s\S]*\]/);if(!m)throw new Error("No JSON in response");return JSON.parse(m[0]);
}

// ── PDF Download ──────────────────────────────────────────────────────────────
function downloadPDF(paper,studentName,attempt){
  const css=`*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;padding:40px;color:#1a1a1a;font-size:14px}.hdr{border-bottom:3px solid #2563eb;padding-bottom:16px;margin-bottom:24px}h1{font-size:22px;font-weight:700;color:#1e3a8a}.meta{font-size:12px;color:#6b7280;margin-top:6px}.sb{background:#1e3a8a;color:#fff;padding:12px 20px;border-radius:10px;display:inline-block;margin-bottom:24px}.sb .p{font-size:28px;font-weight:700}.sb .l{font-size:12px;opacity:.8}.q{margin:18px 0;padding:16px;border:1px solid #e5e7eb;border-radius:10px;page-break-inside:avoid}.qn{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:6px}.qt{font-weight:600;margin-bottom:12px;line-height:1.5}.o{padding:8px 14px;border-radius:6px;margin:4px 0;font-size:13px;display:flex;justify-content:space-between;border:1px solid #e5e7eb}.c{background:#d1fae5;border-color:#6ee7b7;color:#065f46;font-weight:600}.w{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:600}.n{background:#f9fafb}`;
  const meta=[`Questions: ${paper.questions.length}`,`Date: ${new Date().toLocaleDateString()}`,studentName?`Student: ${studentName}`:null].filter(Boolean).join(" | ");
  const score=attempt?`<div class="sb"><div class="p">${attempt.score}/${attempt.total} ${Math.round(attempt.score/attempt.total*100)}%</div><div class="l">Final Score</div></div>`:"";
  const qs=paper.questions.map((q,i)=>{
    const ch=attempt?.answers?.[i],co=q.answer;
    return `<div class="q"><div class="qn">Q${i+1}</div><div class="qt">${q.question}</div>${q.options.map(o=>{const l=o[0];let cl="o n";if(attempt){if(l===co)cl="o c";else if(l===ch&&ch!==co)cl="o w";}const t=attempt?(l===ch&&l===co?"✓ Your answer":l===ch?"✗ Your answer":l===co?"← Correct":""):(l===co?"✓":"");return `<div class="${cl}">${o}<span style="font-size:11px;opacity:.8;margin-left:8px">${t}</span></div>`;}).join("")}</div>`;
  }).join("");
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${paper.title}</title><style>${css}</style></head><body><div class="hdr"><h1>${paper.title}</h1><div class="meta">${meta}</div></div>${score}${qs}<script>window.onload=()=>window.print()<\/script></body></html>`;
  const blob=new Blob([html],{type:"text/html"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.target="_blank";a.download=`${paper.title.replace(/\s+/g,"_")}.html`;a.click();
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("login");
  const [user,setUser]=useState(null);
  const [students,setStudents]=useState([]);
  const [papers,setPapers]=useState([]);
  const [attempts,setAttempts]=useState([]);
  const [weeks,setWeeks]=useState([]);
  const [ready,setReady]=useState(false);
  const [err,setErr]=useState("");

  useEffect(()=>{
    Promise.all([db.getStudents(),db.getPapers(),db.getAttempts(),db.getWeeks()])
      .then(([s,p,a,w])=>{setStudents(s);setPapers(p);setAttempts(a);setWeeks(w);})
      .catch(e=>setErr(e.message))
      .finally(()=>setReady(true));
    // Realtime
    const ch=supa.channel("db").
      on("postgres_changes",{event:"*",schema:"public",table:"students"},()=>db.getStudents().then(setStudents)).
      on("postgres_changes",{event:"*",schema:"public",table:"papers"},()=>db.getPapers().then(setPapers)).
      on("postgres_changes",{event:"*",schema:"public",table:"attempts"},()=>db.getAttempts().then(setAttempts)).
      on("postgres_changes",{event:"*",schema:"public",table:"weeks"},()=>db.getWeeks().then(setWeeks)).
      subscribe();
    return ()=>supa.removeChannel(ch);
  },[]);

  async function refresh(){
    try{const[s,p,a,w]=await Promise.all([db.getStudents(),db.getPapers(),db.getAttempts(),db.getWeeks()]);setStudents(s);setPapers(p);setAttempts(a);setWeeks(w);}catch(e){console.error(e);}
  }

  function login(u,p){
    if(u==="teacher"&&p==="teacher123"){setUser({role:"teacher",name:"Teacher"});setScreen("teacher");return true;}
    const st=students.find(s=>s.username===u&&s.password===p);
    if(st){setUser({...st,role:"student"});setScreen("student");return true;}
    return false;
  }

  if(!ready)return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16,fontFamily:"sans-serif"}}><div style={{fontSize:40}}>📚</div><div style={{fontWeight:600,color:"#374151"}}>Connecting to database…</div>{err&&<Alert msg={err}/>}</div>;

  const props={user,students,papers,attempts,weeks,onLogout:()=>{setUser(null);setScreen("login");},refresh,
    rlStudents:()=>db.getStudents().then(setStudents),
    rlPapers:()=>db.getPapers().then(setPapers),
    rlAttempts:()=>db.getAttempts().then(setAttempts),
    rlWeeks:()=>db.getWeeks().then(setWeeks)};

  return <>
    {err&&<div style={{background:"#fef2f2",borderBottom:"1px solid #fecaca",padding:"8px 20px",fontSize:13,color:"#dc2626",textAlign:"center"}}>⚠️ {err}</div>}
    {screen==="login"&&<Login onLogin={login} students={students}/>}
    {screen==="teacher"&&<TeacherApp {...props}/>}
    {screen==="student"&&<StudentApp {...props}/>}
  </>;
}

function CourseManager({weeks,rlWeeks,papers,rlPapers,students}){

  const [editWeek,setEditWeek]=useState(null);
  const now=new Date();
  const sorted=[...weeks].sort((a,b)=>a.weekNum-b.weekNum).map(w=>w.status==="scheduled"&&new Date(w.publishDate)<=now?{...w,status:"published"}:w);
  const ss={published:{bg:"#ecfdf5",col:"#065f46"},scheduled:{bg:"#eff6ff",col:"#1e40af"},draft:{bg:"#f3f4f6",col:"#6b7280"}};
  return <div style={{padding:32}}>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:24}}>
      <div><h2 style={{fontSize:20,fontWeight:700,color:"#111827",margin:0}}>Course Weeks</h2><p style={{fontSize:13,color:"#9ca3af",marginTop:4}}>Schedule weekly reading material and vocabulary quizzes</p></div>
      <button onClick={()=>{setEditWeek(null);setShowForm(true);}} style={{...S.btn("blue"),padding:"10px 20px"}}>+ Add Week</button>
    </div>
    {sorted.length===0?<Card style={{textAlign:"center",padding:56}}><div style={{fontSize:40,marginBottom:12}}>📅</div><p style={{color:"#9ca3af"}}>No weeks yet.</p></Card>:
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {sorted.map(week=>{
          const st=ss[week.status]||ss.draft,lp=papers.find(p=>p.id===week.paperId),asg=lp?(lp.assignedTo==="all"?students:students.filter(s=>(lp.assignedTo||[]).includes(s.id))):[];
          return <Card key={week.id}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:700,color:"#9ca3af"}}>WEEK {week.weekNum}</span>
                  <h3 style={{margin:0,fontSize:15,fontWeight:700,color:"#111827"}}>{week.title}</h3>
                  <span style={{fontSize:11,background:st.bg,color:st.col,padding:"2px 10px",borderRadius:12,fontWeight:600,textTransform:"capitalize"}}>{week.status}</span>
                  {week.status==="scheduled"&&<span style={{fontSize:11,color:"#6b7280"}}>→ {new Date(week.publishDate).toLocaleDateString()}</span>}
                </div>
                {week.passage&&<p style={{fontSize:12,color:"#6b7280",margin:0}}>{week.passage.slice(0,100)}…</p>}
              </div>
              <div style={{display:"flex",gap:8,flexShrink:0,marginLeft:12}}>
                {week.status==="draft"&&<button onClick={async()=>{await db.saveWeek({...week,status:"published"});await rlWeeks();}} style={S.btn("green")}>Publish</button>}
                <button onClick={()=>{setEditWeek(week);setShowForm(true);}} style={S.btn("gray")}>Edit</button>
                <button onClick={async()=>{if(!confirm("Delete?"))return;await db.deleteWeek(week.id);await rlWeeks();}} style={{...S.btn("gray"),color:"#dc2626"}}>Delete</button>
              </div>
            </div>
            {week.keywords?.length>0&&<div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase",letterSpacing:".4px"}}>Keywords ({week.keywords.length})</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                {week.keywords.slice(0,10).map((kw,i)=><span key={i} style={{fontSize:12,background:"#eff6ff",color:"#2563eb",padding:"3px 10px",borderRadius:20}}>{kw.word}</span>)}
                {week.keywords.length>10&&<span style={{fontSize:12,color:"#9ca3af",padding:"3px 6px"}}>+{week.keywords.length-10} more</span>}
              </div>
            </div>}
            <div style={{background:"#f9fafb",borderRadius:10,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <span style={{fontSize:12,color:"#374151"}}><b>Quiz:</b> {lp?<span style={{color:"#059669"}}>✓ {lp.title} · {lp.assignedTo==="all"?"All":asg.map(s=>s.name).join(", ")||"None"}</span>:<span style={{color:"#9ca3af"}}>Not generated</span>}</span>
              {week.passage&&<WeekQuizCtrl week={week} weeks={weeks} rlWeeks={rlWeeks} papers={papers} rlPapers={rlPapers} students={students}/>}
            </div>
          </Card>;
        })}
      </div>}
    {showForm&&<WeekForm week={editWeek} weeks={weeks} rlWeeks={rlWeeks} onClose={()=>setShowForm(false)}/>}
  </div>;
}

function WeekQuizCtrl({week,weeks,rlWeeks,papers,rlPapers,students}){
  const [loading,setLoading]=useState(false),[showAssign,setShowAssign]=useState(false);
  const lp=papers.find(p=>p.id===week.paperId);
  const isAll=()=>lp&&(lp.assignedTo==="all"||(Array.isArray(lp.assignedTo)&&lp.assignedTo.includes("all")));
  const isA=(sid)=>isAll()||(Array.isArray(lp?.assignedTo)&&lp.assignedTo.includes(sid));
  async function generate(){
    setLoading(true);
    try{const qs=await generateQuizFromText(week.passage,"vocabulary",10);const p={id:"p"+Date.now(),title:`Week ${week.weekNum} — ${week.title}`,questions:qs,quizType:"vocabulary",assignedTo:[],weekId:week.id,createdAt:Date.now()};await db.savePaper(p);await db.saveWeek({...week,paperId:p.id});await Promise.all([rlPapers(),rlWeeks()]);}
    catch(e){alert("Failed: "+e.message);}
    setLoading(false);
  }
  async function toggleAll(){if(!lp)return;const a=isAll();await db.savePaper({...lp,assignedTo:a?[]:["all"]});await rlPapers();}
  async function toggleSt(sid){if(!lp||isAll())return;const cur=Array.isArray(lp.assignedTo)?lp.assignedTo.filter(x=>x!=="all"):[];await db.savePaper({...lp,assignedTo:cur.includes(sid)?cur.filter(x=>x!==sid):[...cur,sid]});await rlPapers();}
  if(!lp)return <button onClick={generate} disabled={loading} style={{...S.btn("purple"),fontSize:12,padding:"6px 14px",opacity:loading?.6:1}}>{loading?<><Spinner/>Generating…</>:"✨ Generate Quiz"}</button>;
  return <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
    <button onClick={()=>setShowAssign(v=>!v)} style={{...S.btn("blue"),fontSize:12,padding:"6px 14px"}}>👥 Assign</button>
    <button onClick={()=>downloadPDF(lp)} style={{...S.btn("gray"),fontSize:12,padding:"6px 14px"}}>⬇ PDF</button>
    {showAssign&&<div style={{width:"100%",marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
      <button onClick={toggleAll} style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${isAll()?"#2563eb":"#e5e7eb"}`,background:isAll()?"#2563eb":"#fff",color:isAll()?"#fff":"#374151",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{isAll()?"✓ ":""}All</button>
      {students.map(s=><button key={s.id} onClick={()=>toggleSt(s.id)} style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${isA(s.id)?"#2563eb":"#e5e7eb"}`,background:isA(s.id)?"#eff6ff":"#fff",color:isA(s.id)?"#2563eb":"#374151",fontSize:12,fontWeight:isA(s.id)?700:400,cursor:"pointer",fontFamily:"inherit"}}>{isA(s.id)?"✓ ":""}{s.name}</button>)}
    </div>}
  </div>;
}

function WeekForm({week,weeks,rlWeeks,onClose}){
  const isEdit=!!week,nextNum=weeks.length?Math.max(...weeks.map(w=>w.weekNum))+1:1;
  const [wn,setWn]=useState(week?.weekNum||nextNum),[title,setTitle]=useState(week?.title||""),[passage,setPassage]=useState(week?.passage||"");

  const [kws,setKws]=useState(week?.keywords||[]),[pdfFile,setPdf]=useState(null),[pageSpec,setPageSpec]=useState(""),[kwCount,setKwCount]=useState(15);
  const [loadPDF,setLoadPDF]=useState(false),[loadKW,setLoadKW]=useState(false),[uploadPct,setUpPct]=useState(0),[uploading,setUploading]=useState(false),[error,setError]=useState("");
  const fileRef=useRef();

  async function upload(){if(!pdfFile)return;setUploading(true);setError("");try{const path=`weeks/week${wn}_${Date.now()}.pdf`;await db.uploadFile(pdfFile,path,p=>setUpPct(p));alert("✅ PDF uploaded!");}catch(e){setError("Upload failed: "+e.message);}setUploading(false);setUpPct(0);}
  async function save(){if(!title.trim())return setError("Title required.");if(status==="scheduled"&&!pubDate)return setError("Set a publish date.");const w={id:week?.id||"w"+Date.now(),weekNum:+wn,title:title.trim(),passage,keywords:kws,status,publishDate:pubDate||null,paperId:week?.paperId||null};await db.saveWeek(w);await rlWeeks();onClose();}
  return <Modal onClose={onClose} wide>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}><h3 style={{margin:0,fontSize:17,fontWeight:700}}>{isEdit?"Edit":"Add"} Week</h3><button onClick={onClose} style={S.btn("gray")}>✕ Close</button></div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div><label style={S.label}>Week #</label><input style={S.input} type="number" min="1" value={wn} onChange={e=>setWn(e.target.value)}/></div>
      <div><label style={S.label}>Title</label><input style={S.input} placeholder="e.g. Animals & Nature" value={title} onChange={e=>setTitle(e.target.value)}/></div>
    </div>
    <div style={{marginBottom:14}}>
      <label style={S.label}>Status</label>
      <div style={{display:"flex",gap:8}}>
        {["draft","published","scheduled"].map(s=><button key={s} onClick={()=>setStatus(s)} style={{padding:"7px 16px",borderRadius:8,border:`2px solid ${status===s?"#2563eb":"#e5e7eb"}`,background:status===s?"#eff6ff":"#fff",color:status===s?"#2563eb":"#374151",fontWeight:status===s?700:400,fontSize:13,cursor:"pointer",fontFamily:"inherit",textTransform:"capitalize"}}>{s}</button>)}
      </div>
      {status==="scheduled"&&<div style={{marginTop:10}}><label style={S.label}>Publish Date</label><input style={{...S.input,width:"auto"}} type="date" value={pubDate} onChange={e=>setPubDate(e.target.value)}/></div>}

      </div>

    </div>
    <div style={{marginBottom:14}}><label style={S.label}>Reading Passage</label><textarea style={{...S.input,height:150,resize:"vertical"}} placeholder="Paste or extract from PDF…" value={passage} onChange={e=>setPassage(e.target.value)}/>{passage&&<p style={{fontSize:11,color:"#059669",marginTop:4}}>✓ {passage.length} characters</p>}</div>
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <label style={S.label}>Key Vocabulary</label>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <select style={{...S.input,width:"auto",fontSize:12,padding:"5px 10px"}} value={kwCount} onChange={e=>setKwCount(+e.target.value)}>{[10,15,20,25].map(n=><option key={n} value={n}>{n} words</option>)}</select>
          <button onClick={extractKW} disabled={!passage||loadKW} style={{...S.btn("orange"),fontSize:12,padding:"7px 14px",opacity:!passage||loadKW?.6:1}}>{loadKW?<><Spinner/>Extracting…</>:"🔍 Extract Keywords"}</button>
        </div>
      </div>
      {kws.length>0?<div style={{border:"1px solid #e5e7eb",borderRadius:10,overflow:"auto",maxHeight:200}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#f9fafb"}}>{["Word","Part of Speech","Definition"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",fontWeight:600,fontSize:11,color:"#6b7280",textTransform:"uppercase"}}>{h}</th>)}</tr></thead>
          <tbody>{kws.map((k,i)=><tr key={i} style={{borderTop:"1px solid #f3f4f6"}}><td style={{padding:"8px 12px",fontWeight:700,color:"#2563eb"}}>{k.word}</td><td style={{padding:"8px 12px",color:"#9ca3af",fontSize:12}}>{k.partOfSpeech}</td><td style={{padding:"8px 12px",color:"#374151"}}>{k.definition}</td></tr>)}
          </tbody>
        </table>
      </div>:<p style={{fontSize:12,color:"#9ca3af",margin:0}}>Click Extract Keywords after adding a passage.</p>}
    </div>
    {error&&<Alert msg={error}/>}
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <button onClick={onClose} style={S.btn("gray")}>Cancel</button>
      <button onClick={save} style={S.btn("blue")}>💾 Save Week</button>
    </div>
  </Modal>;
}

// ── Generate Quiz ─────────────────────────────────────────────────────────────
function GenerateQuiz({papers,rlPapers}){
  const [text,setText]=useState(""),[qtype,setQtype]=useState("mix"),[count,setCount]=useState(5),[title,setTitle]=useState(""),
    [loading,setLoading]=useState(false),[fileLoading,setFL]=useState(false),[error,setError]=useState(""),
    [preview,setPreview]=useState(null),[pdfFile,setPdf]=useState(null),[pageSpec,setPS]=useState(""),
    [fileName,setFN]=useState(""),[uploadPct,setUpPct]=useState(0),[uploading,setUploading]=useState(false);
  const fileRef=useRef();
  const types=[{id:"vocabulary",label:"Vocabulary",icon:"📖"},{id:"prepositions",label:"Prepositions",icon:"🔗"},{id:"fill_blank",label:"Fill in Blank",icon:"✏️"},{id:"mix",label:"Mixed",icon:"🔀"}];
  async function extract(){if(!pdfFile)return;setFL(true);setError("");try{const isPDF=pdfFile.type==="application/pdf"||pdfFile.name.toLowerCase().endsWith(".pdf");const t=isPDF?await extractPDFPages(pdfFile,pageSpec):await extractImageText(pdfFile);setText(t);setFN(pdfFile.name+(pageSpec?` (pages: ${pageSpec})`:""));if(!title)setTitle(pdfFile.name.replace(/\.[^.]+$/,""));}catch(e){setError("Failed: "+e.message);}setFL(false);}
  async function upload(){if(!pdfFile)return;setUploading(true);setError("");try{const path=`papers/${Date.now()}_${pdfFile.name}`;await db.uploadFile(pdfFile,path,p=>setUpPct(p));alert("✅ Uploaded!");}catch(e){setError("Upload failed: "+e.message);}setUploading(false);setUpPct(0);}
  async function generate(){if(!text.trim())return setError("Paste text or extract from a file.");if(!title.trim())return setError("Enter a quiz title.");setError("");setLoading(true);setPreview(null);try{const qs=await generateQuizFromText(text,qtype,count);if(!Array.isArray(qs)||!qs.length)throw new Error("Empty");setPreview({title:title.trim(),questions:qs,quizType:qtype});}catch(e){setError("Failed: "+e.message);}setLoading(false);}
  async function save(){const p={id:"p"+Date.now(),title:preview.title,questions:preview.questions,quizType:preview.quizType,assignedTo:[],createdAt:Date.now()};await db.savePaper(p);await rlPapers();setPreview(null);setText("");setTitle("");setFN("");setPdf(null);alert("✅ Saved! Go to All Papers to assign.");}
  return <div style={{padding:32,maxWidth:740}}>
    <h2 style={{fontSize:20,fontWeight:700,color:"#111827",marginBottom:6,marginTop:0}}>Generate Quiz</h2>

      <div style={{marginBottom:14}}><label style={S.label}>Quiz Type</label><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{types.map(t=><button key={t.id} onClick={()=>setQtype(t.id)} style={{padding:"8px 14px",borderRadius:8,border:`2px solid ${qtype===t.id?"#2563eb":"#e5e7eb"}`,background:qtype===t.id?"#eff6ff":"#fff",color:qtype===t.id?"#2563eb":"#374151",fontWeight:qtype===t.id?700:400,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{t.icon} {t.label}</button>)}</div></div>
      <div style={{marginBottom:14}}><label style={S.label}>Lesson Text</label><textarea style={{...S.input,height:110,resize:"vertical"}} placeholder="Paste text here…" value={text} onChange={e=>setText(e.target.value)}/></div>

          <button onClick={()=>fileRef.current.click()} style={S.btn("gray")}>{pdfFile?`📄 ${pdfFile.name}`:"📎 Choose File"}</button>

          <button onClick={upload} disabled={!pdfFile||uploading} style={{...S.btn("orange"),opacity:!pdfFile||uploading?.6:1}}>{uploading?<><Spinner/>Uploading…</>:"☁ Upload"}</button>

        <p style={{margin:"0 0 10px",fontWeight:700,fontSize:14}}>{i+1}. {q.question}</p>

      </div>)}
    </Card>}
  </div>;
}

// ── Papers Tab ────────────────────────────────────────────────────────────────
function PapersTab({papers,students,attempts,rlPapers}){

  async function tAll(paper){await db.savePaper({...paper,assignedTo:isAll(paper)?[]:["all"]});await rlPapers();}
  async function tSt(paper,sid){if(isAll(paper))return;const cur=Array.isArray(paper.assignedTo)?paper.assignedTo.filter(x=>x!=="all"):[];await db.savePaper({...paper,assignedTo:cur.includes(sid)?cur.filter(x=>x!==sid):[...cur,sid]});await rlPapers();}

        {papers.map(paper=>{
          const att=attempts.filter(a=>a.paperId===paper.id&&a.submitted),asg=students.filter(s=>isA(paper,s.id));
          return <Card key={paper.id}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14}}>
              <div><h3 style={{margin:0,fontSize:15,fontWeight:700}}>{paper.title}</h3><p style={{margin:"4px 0 0",fontSize:12,color:"#9ca3af"}}>{paper.questions.length} questions · {new Date(paper.createdAt).toLocaleDateString()}</p></div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setDp(paper)} style={S.btn("gray")}>👁 View</button>

              </div>
            </div>
            <div style={{background:"#f9fafb",borderRadius:10,padding:12,marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:".4px"}}>Assign To</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button onClick={()=>tAll(paper)} style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${isAll(paper)?"#2563eb":"#e5e7eb"}`,background:isAll(paper)?"#2563eb":"#fff",color:isAll(paper)?"#fff":"#374151",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{isAll(paper)?"✓ ":""}All</button>
                {students.map(s=><button key={s.id} onClick={()=>tSt(paper,s.id)} style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${isA(paper,s.id)?"#2563eb":"#e5e7eb"}`,background:isA(paper,s.id)?"#eff6ff":"#fff",color:isA(paper,s.id)?"#2563eb":"#374151",fontSize:12,fontWeight:isA(paper,s.id)?700:400,cursor:"pointer",fontFamily:"inherit"}}>{isA(paper,s.id)?"✓ ":""}{s.name}</button>)}
              </div>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6,textTransform:"uppercase",letterSpacing:".4px"}}>Attempts ({att.length}/{asg.length})</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {asg.map(s=>{const a=att.find(a=>a.studentId===s.id);return <button key={s.id} onClick={()=>a&&setDa({attempt:a,paper,student:s})} style={{padding:"6px 12px",borderRadius:8,border:`1.5px solid ${a?"#6ee7b7":"#e5e7eb"}`,background:a?"#ecfdf5":"#f9fafb",color:a?"#065f46":"#9ca3af",fontSize:12,cursor:a?"pointer":"default",fontFamily:"inherit",fontWeight:a?600:400}}>{s.name} {a?`✓ ${a.score}/${a.total}`:"⏳"}</button>;})}
            </div>
          </Card>;
        })}
      </div>}
    {dp&&<Modal onClose={()=>setDp(null)}><div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><h3 style={{margin:0}}>{dp.title}</h3><div style={{display:"flex",gap:8}}><button onClick={()=>downloadPDF(dp)} style={S.btn("blue")}>⬇ PDF</button><button onClick={()=>setDp(null)} style={S.btn("gray")}>Close</button></div></div><QList paper={dp}/></Modal>}
    {da&&<Modal onClose={()=>setDa(null)}><div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><div><h3 style={{margin:0}}>{da.student.name}</h3><p style={{margin:"4px 0 0",fontSize:13,color:"#6b7280"}}>{da.paper.title} · {da.attempt.score}/{da.attempt.total}</p></div><div style={{display:"flex",gap:8}}><button onClick={()=>downloadPDF(da.paper,da.student.name,da.attempt)} style={S.btn("blue")}>⬇ PDF</button><button onClick={()=>setDa(null)} style={S.btn("gray")}>Close</button></div></div><RDetail paper={da.paper} attempt={da.attempt}/></Modal>}
  </div>;
}

function QList({paper}){return <div style={{display:"flex",flexDirection:"column",gap:12}}>{paper.questions.map((q,i)=><div key={i} style={{border:"1px solid #f3f4f6",borderRadius:10,padding:14}}><p style={{margin:"0 0 10px",fontWeight:700,fontSize:14}}>{i+1}. {q.question}</p>{q.options.map((o,j)=><div key={j} style={{padding:"7px 12px",borderRadius:6,marginBottom:4,fontSize:13,background:o[0]===q.answer?"#d1fae5":"#f9fafb",color:o[0]===q.answer?"#065f46":"#374151",fontWeight:o[0]===q.answer?700:400}}>{o}{o[0]===q.answer?" ✓":""}</div>)}</div>)}</div>;}
function RDetail({paper,attempt}){return <div style={{display:"flex",flexDirection:"column",gap:12}}>{paper.questions.map((q,i)=>{const ch=attempt.answers?.[i],co=q.answer;return <div key={i} style={{border:"1px solid #f3f4f6",borderRadius:10,padding:14}}><p style={{margin:"0 0 10px",fontWeight:700,fontSize:14}}>{i+1}. {q.question}</p>{q.options.map((o,j)=>{const l=o[0],isC=l===co,isCh=l===ch;let bg="#f9fafb",col="#374151",fw=400;if(isC){bg="#d1fae5";col="#065f46";fw=700;}else if(isCh&&!isC){bg="#fee2e2";col="#991b1b";fw=700;}const tag=isCh&&isC?"✓ Correct":isCh?"✗ Wrong":isC?"← Answer":"";return <div key={j} style={{padding:"7px 12px",borderRadius:6,marginBottom:4,fontSize:13,background:bg,color:col,fontWeight:fw,display:"flex",justifyContent:"space-between"}}><span>{o}</span><span style={{fontSize:11,opacity:.8}}>{tag}</span></div>;})}</div>;})}</div>;}

// ── Students Tab ──────────────────────────────────────────────────────────────
function StudentsTab({students,rlStudents,attempts}){
  const [name,setName]=useState(""),[uname,setUname]=useState(""),[pass,setPass]=useState(""),[email,setEmail]=useState(""),[err,setErr]=useState("");
  async function add(){setErr("");if(!name.trim()||!uname.trim()||!pass.trim())return setErr("Name, username, password required.");if(students.find(s=>s.username===uname.trim()))return setErr("Username taken.");await db.saveStudent({id:"s"+Date.now(),name:name.trim(),username:uname.trim(),password:pass.trim(),email:email.trim()});await rlStudents();setName("");setUname("");setPass("");setEmail("");}
  return <div style={{padding:32,maxWidth:700}}>
    <h2 style={{fontSize:20,fontWeight:700,color:"#111827",marginBottom:20,marginTop:0}}>Students</h2>
    <Card style={{marginBottom:20}}>
      <h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:600}}>Add New Student</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div><label style={S.label}>Full Name *</label><input style={S.input} value={name} onChange={e=>setName(e.target.value)}/></div>
        <div><label style={S.label}>Username *</label><input style={S.input} value={uname} onChange={e=>setUname(e.target.value)}/></div>
        <div><label style={S.label}>Password *</label><input style={S.input} value={pass} onChange={e=>setPass(e.target.value)}/></div>
        <div><label style={S.label}>Email</label><input style={S.input} value={email} onChange={e=>setEmail(e.target.value)}/></div>
      </div>
      {err&&<Alert msg={err}/>}
      <button onClick={add} style={S.btn("blue")}>+ Add Student</button>
    </Card>
    <Card>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead><tr style={{color:"#9ca3af",fontSize:11,borderBottom:"2px solid #f3f4f6"}}>{["Name","Username","Password","Attempts",""].map(h=><th key={h} style={{textAlign:"left",paddingBottom:10,fontWeight:600,textTransform:"uppercase",letterSpacing:".4px"}}>{h}</th>)}</tr></thead>
        <tbody>{students.map(s=>{const att=attempts.filter(a=>a.studentId===s.id&&a.submitted).length;return <tr key={s.id} style={{borderTop:"1px solid #f3f4f6"}}><td style={{padding:"11px 0",fontWeight:600}}>{s.name}</td><td style={{color:"#6b7280"}}>{s.username}</td><td style={{color:"#6b7280",fontFamily:"monospace",fontSize:12}}>{s.password}</td><td style={{color:"#6b7280"}}>{att}</td><td><button onClick={async()=>{if(!confirm("Delete?"))return;await db.deleteStudent(s.id);await rlStudents();}} style={{...S.btn("gray"),color:"#dc2626",padding:"4px 10px",fontSize:12}}>Delete</button></td></tr>;})}
        </tbody>
      </table>
    </Card>
  </div>;
}

// ── Results Tab ───────────────────────────────────────────────────────────────
function ResultsTab({students,papers,attempts}){
  const [filter,setFilter]=useState("all");
  const filtered=attempts.filter(a=>a.submitted&&(filter==="all"||a.studentId===filter));
  function exportCSV(){const h="Student,Paper,Score,Total,Percentage,Date\n",b=filtered.map(a=>{const st=students.find(s=>s.id===a.studentId),p=papers.find(p=>p.id===a.paperId);return `"${st?.name}","${p?.title}",${a.score},${a.total},${Math.round(a.score/a.total*100)}%,"${new Date(a.submittedAt).toLocaleDateString()}"`;}).join("\n");const blob=new Blob([h+b],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="results.csv";a.click();}
  return <div style={{padding:32}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}><h2 style={{fontSize:20,fontWeight:700,color:"#111827",margin:0}}>Results</h2>
      <div style={{display:"flex",gap:10}}><select style={{...S.input,width:"auto",fontSize:13}} value={filter} onChange={e=>setFilter(e.target.value)}><option value="all">All Students</option>{students.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select><button onClick={exportCSV} style={S.btn("blue")}>⬇ Export CSV</button></div>
    </div>
    <Card><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
      <thead><tr style={{color:"#9ca3af",fontSize:11,borderBottom:"2px solid #f3f4f6"}}>{["Student","Paper","Score","%","Date"].map(h=><th key={h} style={{textAlign:"left",paddingBottom:10,fontWeight:600,textTransform:"uppercase",letterSpacing:".4px"}}>{h}</th>)}</tr></thead>
      <tbody>{filtered.length===0?<tr><td colSpan={5} style={{padding:"36px 0",textAlign:"center",color:"#9ca3af"}}>No results yet.</td></tr>:filtered.map(a=>{const st=students.find(s=>s.id===a.studentId),p=papers.find(p=>p.id===a.paperId),pct=Math.round(a.score/a.total*100);return <tr key={a.id} style={{borderTop:"1px solid #f3f4f6"}}><td style={{padding:"11px 0",fontWeight:600}}>{st?.name}</td><td style={{color:"#6b7280"}}>{p?.title}</td><td>{a.score}/{a.total}</td><td><Pct val={pct}/></td><td style={{color:"#9ca3af"}}>{new Date(a.submittedAt).toLocaleDateString()}</td></tr>;})}
      </tbody>
    </table></Card>
  </div>;
}

// ── Student App ───────────────────────────────────────────────────────────────
function StudentApp({user,papers,attempts,weeks,onLogout,rlAttempts,refresh}){
  const [tab,setTab]=useState("course"),[activePaper,setAP]=useState(null);
  useEffect(()=>{refresh();},[]);
  const now=new Date();
  const pubWeeks=[...weeks].filter(w=>w.status==="published"||(w.status==="scheduled"&&new Date(w.publishDate)<=now)).sort((a,b)=>a.weekNum-b.weekNum);
  const myPapers=papers.filter(p=>{if(p.assignedTo==="all")return true;if(Array.isArray(p.assignedTo))return p.assignedTo.includes("all")||p.assignedTo.includes(user.id);return false;});
  const myAttempts=attempts.filter(a=>a.studentId===user.id&&a.submitted);
  async function submit(paper,answers){const score=paper.questions.filter((q,i)=>answers[i]===q.answer).length;await db.saveAttempt({id:"a"+Date.now(),studentId:user.id,paperId:paper.id,answers,score,total:paper.questions.length,submitted:true,submittedAt:Date.now()});await rlAttempts();setAP(null);setTab("results");}
  if(activePaper)return <TakeQuiz paper={activePaper} onSubmit={ans=>submit(activePaper,ans)} onBack={()=>setAP(null)}/>;
  const tabs=[{id:"course",label:"Course",icon:"📅"},{id:"quizzes",label:"My Quizzes",icon:"📄"},{id:"results",label:"My Results",icon:"📈"}];
  return <div style={{display:"flex",minHeight:"100vh",background:"#f8fafc"}}>
    <Sidebar tabs={tabs} active={tab} onSelect={setTab} role="student" onLogout={onLogout} onRefresh={refresh}/>
    <div style={{flex:1,padding:32}}>
      {tab==="course"&&<>
        <h2 style={{fontSize:20,fontWeight:700,color:"#111827",marginBottom:6,marginTop:0}}>Course Material</h2>
        <p style={{fontSize:13,color:"#9ca3af",marginBottom:22}}>Weekly reading and vocabulary — new material added as the course progresses</p>
        {pubWeeks.length===0?<Card style={{textAlign:"center",padding:56}}><div style={{fontSize:36,marginBottom:10}}>📅</div><p style={{color:"#9ca3af"}}>No material published yet.</p></Card>:
          <div style={{display:"flex",flexDirection:"column",gap:20,maxWidth:760}}>
            {pubWeeks.map(week=>{
              const lp=papers.find(p=>p.id===week.paperId&&myPapers.find(mp=>mp.id===p.id));
              const done=lp&&myAttempts.find(a=>a.paperId===lp.id);
              return <Card key={week.id}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><span style={{background:"#2563eb",color:"#fff",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>WEEK {week.weekNum}</span><h3 style={{margin:0,fontSize:16,fontWeight:700,color:"#111827"}}>{week.title}</h3></div>
                {week.passage&&<div style={{marginBottom:16}}><div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:".4px"}}>Reading Passage</div><div style={{background:"#f8fafc",border:"1px solid #e5e7eb",borderRadius:10,padding:16,fontSize:14,color:"#374151",lineHeight:1.9,maxHeight:220,overflowY:"auto",whiteSpace:"pre-wrap"}}>{week.passage}</div></div>}
                {week.keywords?.length>0&&<div style={{marginBottom:16}}><div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:8,textTransform:"uppercase",letterSpacing:".4px"}}>Key Vocabulary ({week.keywords.length} words)</div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>{week.keywords.map((kw,i)=><div key={i} style={{background:"#eff6ff",borderRadius:8,padding:"8px 12px"}}><div style={{fontWeight:700,color:"#2563eb",fontSize:13}}>{kw.word} <span style={{fontSize:10,color:"#93c5fd",fontWeight:400}}>({kw.partOfSpeech})</span></div><div style={{fontSize:12,color:"#374151",marginTop:2}}>{kw.definition}</div></div>)}</div></div>}
                {lp&&<div style={{background:"#f9fafb",borderRadius:10,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:13,fontWeight:600,color:"#374151"}}>📝 Vocabulary Quiz</span>{done?<span style={{fontSize:12,background:"#d1fae5",color:"#065f46",padding:"5px 14px",borderRadius:20,fontWeight:700}}>Done ✓ {done.score}/{done.total}</span>:<button onClick={()=>setAP(lp)} style={{...S.btn("blue"),padding:"8px 18px"}}>Start Quiz →</button>}</div>}
              </Card>;
            })}
          </div>}
      </>}
      {tab==="quizzes"&&<>
        <h2 style={{fontSize:20,fontWeight:700,color:"#111827",marginBottom:22,marginTop:0}}>My Quizzes</h2>
        {myPapers.length===0?<Card style={{textAlign:"center",padding:56}}><p style={{color:"#9ca3af"}}>No quizzes assigned yet.</p></Card>:
          <div style={{display:"flex",flexDirection:"column",gap:12,maxWidth:620}}>{myPapers.map(p=>{const done=myAttempts.find(a=>a.paperId===p.id);return <Card key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 24px"}}><div><h3 style={{margin:0,fontSize:15,fontWeight:700}}>{p.title}</h3><p style={{margin:"4px 0 0",fontSize:12,color:"#9ca3af"}}>{p.questions.length} questions</p>{done&&<p style={{margin:"4px 0 0",fontSize:12,color:"#059669",fontWeight:600}}>✓ {done.score}/{done.total} ({Math.round(done.score/done.total*100)}%)</p>}</div>{done?<span style={{fontSize:12,background:"#d1fae5",color:"#065f46",padding:"5px 14px",borderRadius:20,fontWeight:700}}>Done ✓</span>:<button onClick={()=>setAP(p)} style={{...S.btn("blue"),padding:"10px 20px"}}>Start →</button>}</Card>;})}
          </div>}
      </>}
      {tab==="results"&&<>
        <h2 style={{fontSize:20,fontWeight:700,color:"#111827",marginBottom:22,marginTop:0}}>My Results</h2>
        {myAttempts.length===0?<Card style={{textAlign:"center",padding:56}}><p style={{color:"#9ca3af"}}>No completed quizzes yet.</p></Card>:
          <div style={{display:"flex",flexDirection:"column",gap:16,maxWidth:660}}>{myAttempts.map(att=>{const p=papers.find(p=>p.id===att.paperId);if(!p)return null;const pct=Math.round(att.score/att.total*100);return <Card key={att.id}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}><div><h3 style={{margin:0,fontSize:15,fontWeight:700}}>{p.title}</h3><p style={{margin:"4px 0 0",fontSize:12,color:"#9ca3af"}}>{new Date(att.submittedAt).toLocaleDateString()}</p></div><div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:22,fontWeight:700,color:pct>=70?"#059669":pct>=50?"#d97706":"#dc2626"}}>{pct}%</span><button onClick={()=>downloadPDF(p,user.name,att)} style={{...S.btn("blue"),padding:"7px 14px",fontSize:12}}>⬇ PDF</button></div></div><RDetail paper={p} attempt={att}/></Card>;})}
          </div>}
      </>}
    </div>
  </div>;
}

// ── Take Quiz ─────────────────────────────────────────────────────────────────
function TakeQuiz({paper,onSubmit,onBack}){
  const [answers,setA]=useState({}),[confirm,setC]=useState(false);
  const done=Object.keys(answers).length,pct=Math.round(done/paper.questions.length*100);
  return <div style={{minHeight:"100vh",background:"#f8fafc"}}>
    <div style={{background:"#1e3a8a",color:"#fff",padding:"14px 32px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}><button onClick={onBack} style={{...S.btn("gray"),background:"rgba(255,255,255,0.15)",color:"#fff",border:"none"}}>← Back</button><span style={{fontWeight:700,fontSize:15}}>{paper.title}</span></div>
      <div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:13,opacity:.8}}>{done}/{paper.questions.length}</span><div style={{background:"rgba(255,255,255,0.2)",borderRadius:20,height:8,width:140}}><div style={{background:"#34d399",borderRadius:20,height:8,width:`${pct}%`,transition:"width .3s"}}/></div></div>
    </div>
    <div style={{maxWidth:640,margin:"0 auto",padding:32}}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {paper.questions.map((q,i)=>(
          <Card key={i} style={{border:answers[i]?"1px solid #bfdbfe":"1px solid #e5e7eb"}}>
            <p style={{margin:"0 0 12px",fontWeight:700,fontSize:14,color:"#111827",lineHeight:1.6}}>Q{i+1}. {q.question}</p>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {q.options.map((o,j)=>{
                const sel=answers[i]===o[0];
                return <button key={j} onClick={()=>setA({...answers,[i]:o[0]})} style={{textAlign:"left",padding:"10px 14px",borderRadius:8,border:`2px solid ${sel?"#2563eb":"#e5e7eb"}`,background:sel?"#eff6ff":"#fff",color:sel?"#1d4ed8":"#374151",fontSize:13,cursor:"pointer",fontWeight:sel?700:400,transition:"all .15s",fontFamily:"inherit"}}>{o}</button>;
              })}
            </div>
          </Card>
        ))}
      </div>
      <button onClick={()=>{if(done<paper.questions.length)return alert(`Please answer all questions. (${paper.questions.length-done} remaining)`);setC(true);}} style={{...S.btn("blue"),width:"100%",padding:"14px 0",fontSize:15,marginTop:20,opacity:done===paper.questions.length?1:.6}}>
        Submit Quiz ({done}/{paper.questions.length})
      </button>
    </div>
    {confirm&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
      <div style={{background:"#fff",borderRadius:18,padding:40,maxWidth:340,width:"100%",textAlign:"center",boxShadow:"0 25px 50px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:44,marginBottom:10}}>📝</div>
        <h3 style={{margin:"0 0 8px",fontSize:18}}>Submit Quiz?</h3>
        <p style={{color:"#9ca3af",fontSize:13,marginBottom:24}}>You cannot change answers after submitting.</p>
        <div style={{display:"flex",gap:10}}><button onClick={()=>setC(false)} style={{...S.btn("gray"),flex:1,padding:"12px 0"}}>Cancel</button><button onClick={()=>onSubmit(answers)} style={{...S.btn("blue"),flex:1,padding:"12px 0"}}>Submit ✓</button></div>
      </div>
    </div>}
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
